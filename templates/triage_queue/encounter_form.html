{% extends "base.html" %}
{% block title %}Triage - {{ patient.last_name }}{% endblock %}
{% block content %}
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Triage &amp; open visit</h1>
            <p class="text-sm text-slate-600">Patient: <strong>{{ patient.last_name }}, {{ patient.first_name }}</strong></p>
        </div>
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <section class="space-y-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Visit</h2>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Chief complaint *</label>
                    <textarea name="chief_complaint"
                              rows="2"
                              required
                              class="w-full border rounded-xl px-3 py-2 text-sm"
                              placeholder="e.g. Fever for 3 days, productive cough"></textarea>
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Encounter type</label>
                        <select name="encounter_type"
                                class="w-full border rounded-xl px-3 py-2 text-sm bg-white">
                            <option value="OUTPATIENT">Outpatient</option>
                            <option value="EMERGENCY">Emergency</option>
                            <option value="OBSERVATION">Observation</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Priority</label>
                        <select name="priority"
                                class="w-full border rounded-xl px-3 py-2 text-sm bg-white">
                            <option value="1">Routine</option>
                            <option value="2">Urgent</option>
                            <option value="3">Resuscitation</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Doctor on duty *</label>
                        <select name="assigned_doctor_id"
                                required
                                class="w-full border rounded-xl px-3 py-2 text-sm bg-white">
                            <option value="">-- Choose --</option>
                            {% for doc in doctors %}
                                <option value="{{ doc.id }}">Dr. {{ doc.user.get_full_name|default:doc.user.username }}</option>
                            {% empty %}
                                <option value="" disabled>No doctors are clocked in</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </section>
            <section class="space-y-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Vital signs</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Temp (°C)</label>
                        <input type="number"
                               step="0.1"
                               name="temperature_c"
                               class="w-full border rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Pulse (bpm)</label>
                        <input type="number"
                               name="pulse_bpm"
                               class="w-full border rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Resp. rate</label>
                        <input type="number"
                               name="respiratory_rate"
                               class="w-full border rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">SpO2 (%)</label>
                        <input type="number"
                               name="spo2_percent"
                               class="w-full border rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">BP systolic</label>
                        <input type="number"
                               name="systolic_mmhg"
                               class="w-full border rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">BP diastolic</label>
                        <input type="number"
                               name="diastolic_mmhg"
                               class="w-full border rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Weight (kg)</label>
                        <input type="number"
                               step="0.01"
                               name="weight_kg"
                               class="w-full border rounded-xl px-3 py-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Triage notes</label>
                    <textarea name="triage_notes"
                              rows="2"
                              class="w-full border rounded-xl px-3 py-2 text-sm"
                              placeholder="Anything the doctor should know before seeing the patient"></textarea>
                </div>
            </section>
            <button type="submit"
                    class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-semibold hover:bg-indigo-700">
                Add to queue
            </button>
        </form>
    </div>
{% endblock %}
