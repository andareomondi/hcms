{% extends 'base.html' %} {% block content %}
<div class="max-w-xl mx-auto bg-white p-6 rounded shadow">
  <h1 class="text-xl font-bold mb-4">Open Encounter & Triage Vitals</h1>
  <p class="text-sm text-slate-600 mb-4">
    Patient: <strong>{{ patient.last_name }}, {{ patient.first_name }}</strong>
  </p>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1"
          >Encounter Type</label
        >
        <select name="encounter_type" class="w-full border rounded px-3 py-2">
          <option value="OUTPATIENT">Outpatient</option>
          <option value="EMERGENCY">Emergency</option>
          <option value="OBSERVATION">Observation</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1"
          >Priority</label
        >
        <select name="priority" class="w-full border rounded px-3 py-2">
          <option value="1">Routine</option>
          <option value="2">Urgent</option>
          <option value="3">Resuscitation</option>
        </select>
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold uppercase text-slate-600 mb-1"
        >Assign Physician</label
      >
      <select name="assigned_doctor_id" class="w-full border rounded px-3 py-2">
        {% for doc in doctors %}
        <option value="{{ doc.id }}">Dr. {{ doc.user.get_full_name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="grid grid-cols-3 gap-3">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1"
          >Temp (&deg;C)</label
        >
        <input
          type="number"
          step="0.1"
          name="temperature_c"
          class="w-full border rounded px-3 py-2"
        />
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1"
          >Pulse (bpm)</label
        >
        <input
          type="number"
          name="pulse_bpm"
          class="w-full border rounded px-3 py-2"
        />
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1"
          >SpO2 (%)</label
        >
        <input
          type="number"
          name="spo2_percent"
          class="w-full border rounded px-3 py-2"
        />
      </div>
    </div>

    <button
      type="submit"
      class="w-full bg-indigo-600 text-white py-2 rounded font-semibold hover:bg-indigo-700"
    >
      Admit to Queue
    </button>
  </form>
</div>
{% endblock %}
