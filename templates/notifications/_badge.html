<span id="notif-badge"
      class="absolute -top-0.5 -right-0.5"
      hx-get="{% url 'notifications:count' %}"
      hx-trigger="every 15s"
      hx-swap="outerHTML">{% if count %}<span class="min-w-[18px] h-[18px] px-1 bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center">{{ count }}</span>{% endif %}</span>
