{% extends "base.html" %}
{% block content %}
    <div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200 space-y-4 mt-6">
        <h1 class="text-2xl font-bold text-slate-900">Request submitted</h1>
        <p class="text-sm text-slate-600">
            Thank you. Your request for the account <strong>{{ username }}</strong> has
            been sent to a system administrator. You will be able to log in once it is
            approved.
        </p>
        <a href="{% url 'login' %}"
           class="text-teal-600 font-semibold hover:underline">Back to login</a>
    </div>
{% endblock %}
