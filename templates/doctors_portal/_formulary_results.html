<ul class="divide-y divide-slate-100">
    {% for m in results %}
        <li>
            <button type="button"
                    @click="pick('{{ m.id }}', '{{ m.brand_name|escapejs }}', '{{ m.strength|escapejs }}', {{ m.available }})"
                    class="w-full text-left px-3 py-2.5 hover:bg-indigo-50 flex justify-between items-center gap-3">
                <span>
                    <span class="font-bold text-sm text-slate-900">{{ m.brand_name }}</span>
                    <span class="text-xs text-slate-500">{{ m.generic_name }} · {{ m.strength }} · {{ m.form }}</span>
                </span>
                <span class="text-xs font-bold whitespace-nowrap {% if m.available > 0 %}text-emerald-700{% else %}text-red-700{% endif %}">
                    {% if m.available > 0 %}{{ m.available }} available to prescribe{% else %}Not available{% endif %}
                </span>
            </button>
        </li>
    {% empty %}
        <li class="p-3 text-xs text-slate-500">No formulary match. Use External purchase below.</li>
    {% endfor %}
</ul>
