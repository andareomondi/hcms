{% extends "base.html" %}
{% load static %}
{% block title %}Login - HCMS{% endblock %}
{% block content %}
    <div class="max-w-md mx-auto bg-white p-8 rounded shadow mt-10">
        <h1 class="text-2xl font-bold mb-6 text-center text-slate-800">HCMS Staff Login</h1>
        {% if form.errors %}
            <div class="bg-red-100 text-red-700 p-3 rounded mb-4 text-xs font-semibold">
                Your username and password didn't match. Please try again.
            </div>
        {% endif %}
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Username</label>
                <input type="text"
                       name="username"
                       autofocus
                       autocapitalize="none"
                       autocomplete="username"
                       maxlength="150"
                       required
                       class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
                <input type="password"
                       name="password"
                       autocomplete="current-password"
                       required
                       class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </div>
            <input type="hidden" name="next" value="{{ next }}" />
            <button type="submit"
                    class="w-full bg-teal-600 text-white py-2 rounded font-semibold hover:bg-teal-700 transition">
                Log In
            </button>
        </form>
        <div class="mt-4 text-center text-sm text-slate-600">
            Need a staff account? <a href="{% url 'core_patients:staff_register' %}"
    class="text-teal-600 font-semibold hover:underline">Register here</a>
        </div>
    </div>
{% endblock %}
