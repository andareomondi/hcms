{% extends "base.html" %}
{% block title %}Stock units - HCMS{% endblock %}
{% block content %}
    <div class="space-y-6">
        <div class="flex flex-col md:flex-row md:justify-between gap-3">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Stock units</h1>
                <p class="text-sm text-slate-500">Every pack and vial, by serial, with its batch and expiry.</p>
            </div>
            {% if can_manage %}
                <a href="{% url 'pharmacy:receive' %}"
                   class="min-h-11 inline-flex items-center px-4 rounded-xl bg-teal-600 text-white text-sm font-bold">Receive stock</a>
            {% endif %}
        </div>
        <!-- Filters: each field searches as you type or changes. Enter does nothing extra. -->
        <form method="get"
              action="{% url 'pharmacy:units' %}"
              onsubmit="return false"
              class="grid grid-cols-1 md:grid-cols-5 gap-3 bg-white rounded-2xl border p-4">
            <input name="serial"
                   value="{{ filters.serial }}"
                   placeholder="Serial"
                   autocomplete="off"
                   hx-get="{% url 'pharmacy:units' %}"
                   hx-trigger="input changed delay:300ms, search"
                   hx-target="#units-results"
                   hx-include="closest form"
                   hx-push-url="true"
                   class="min-h-11 border rounded-xl px-3 text-sm font-mono uppercase">
            <input name="medicine"
                   value="{{ filters.medicine }}"
                   placeholder="Medicine (brand or generic)"
                   autocomplete="off"
                   hx-get="{% url 'pharmacy:units' %}"
                   hx-trigger="input changed delay:300ms, search"
                   hx-target="#units-results"
                   hx-include="closest form"
                   hx-push-url="true"
                   class="min-h-11 border rounded-xl px-3 text-sm">
            <input name="batch"
                   value="{{ filters.batch }}"
                   placeholder="Batch number"
                   autocomplete="off"
                   hx-get="{% url 'pharmacy:units' %}"
                   hx-trigger="input changed delay:300ms, search"
                   hx-target="#units-results"
                   hx-include="closest form"
                   hx-push-url="true"
                   class="min-h-11 border rounded-xl px-3 text-sm font-mono uppercase">
            <select name="status"
                    hx-get="{% url 'pharmacy:units' %}"
                    hx-trigger="change"
                    hx-target="#units-results"
                    hx-include="closest form"
                    hx-push-url="true"
                    class="min-h-11 border rounded-xl px-3 text-sm bg-white">
                <option value="">Any status</option>
                {% for code, label in status_choices %}
                    <option value="{{ code }}" {% if filters.status == code %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <select name="expiry"
                    hx-get="{% url 'pharmacy:units' %}"
                    hx-trigger="change"
                    hx-target="#units-results"
                    hx-include="closest form"
                    hx-push-url="true"
                    class="min-h-11 border rounded-xl px-3 text-sm bg-white">
                {% for code, label in expiry_choices %}
                    <option value="{{ code }}" {% if filters.expiry == code %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <div class="md:col-span-5 flex justify-end">
                <a href="{% url 'pharmacy:units' %}"
                   class="text-xs font-bold text-slate-600 hover:underline">Clear filters</a>
            </div>
        </form>
        <div id="units-results">{% include "pharmacy/_units_results.html" %}</div>
    </div>
{% endblock %}
