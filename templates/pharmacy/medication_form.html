{% extends "base.html" %} {% block title %}Manage Medication - HCMS{% endblock %} {% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-slate-900">
            {% if medication %}Edit Medication{% else %}Add New Medication{% endif %}
        </h1>
        <p class="text-sm text-slate-500">Update drug info, strength, unit pricing, and stock quantity.</p>
    </div>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Brand Name</label>
                <input type="text"
                       name="brand_name"
                       value="{{ medication.brand_name|default:'' }}"
                       required
                       class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500" />
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Generic Name</label>
                <input type="text"
                       name="generic_name"
                       value="{{ medication.generic_name|default:'' }}"
                       required
                       class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500" />
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Form (e.g. Tablet, Syrup)</label>
                <input type="text"
                       name="form"
                       value="{{ medication.form|default:'Tablet' }}"
                       required
                       class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500" />
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Strength (e.g. 500mg)</label>
                <input type="text"
                       name="strength"
                       value="{{ medication.strength|default:'500mg' }}"
                       required
                       class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500" />
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Unit Price (KES)</label>
                <input type="number"
                       step="0.01"
                       name="unit_price"
                       value="{{ medication.unit_price|default:10.00 }}"
                       required
                       class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500" />
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Current Stock Quantity</label>
                <input type="number"
                       name="quantity"
                       value="{{ stock_item.quantity|default:100 }}"
                       required
                       class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500" />
            </div>
        </div>
        <button type="submit"
                class="w-full bg-teal-600 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-teal-700 transition shadow-sm">
            Save Medication Details
        </button>
    </form>
</div>
{% endblock %}
