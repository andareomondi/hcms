{% extends "base.html" %}
{% block title %}Book surgery - HCMS{% endblock %}
{% block content %}
<div class="max-w-2xl space-y-6">
  <div>
    <a href="{% url 'surgery:list' %}" class="text-xs text-slate-500 hover:underline">← Surgery</a>
    <h1 class="text-2xl font-bold text-slate-900 mt-1">Book surgery for {{ patient }}</h1>
    <p class="text-sm text-slate-500">Surgery is its own entry. It is not an open visit.</p>
  </div>
  <form method="post" class="bg-white rounded-2xl border p-5 space-y-4">
    {% csrf_token %}
    <label class="block text-sm font-semibold">Procedure
      <select name="procedure" required class="mt-1 w-full border rounded-lg p-2">
        {% for p in procedures %}<option value="{{ p.pk }}">{{ p.name }} ({{ p.get_category_display }}, KES {{ p.price }})</option>{% endfor %}
      </select>
    </label>
    <label class="block text-sm font-semibold">Category
      <select name="category" required class="mt-1 w-full border rounded-lg p-2">
        {% for value, label in categories %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
      </select>
    </label>
    <label class="block text-sm font-semibold">Indication: the consultation or admission that decided on it
      <select name="indication" class="mt-1 w-full border rounded-lg p-2">
        <option value="">None (emergency only)</option>
        {% for e in indications %}<option value="{{ e.pk }}">{{ e.opened_at|date:"d M Y" }} · {{ e.get_encounter_type_display }}</option>{% endfor %}
      </select>
    </label>
    <label class="block text-sm font-semibold">Scheduled time (optional)
      <input type="datetime-local" name="scheduled_for" class="mt-1 w-full border rounded-lg p-2">
    </label>
    <label class="block text-sm font-semibold">Allergy clearance note (needed only if the patient has an active allergy; doctors only)
      <textarea name="allergy_note" rows="3" class="mt-1 w-full border rounded-lg p-2"></textarea>
    </label>
    <button class="bg-teal-700 text-white font-semibold rounded-lg px-4 py-2">Book surgery</button>
  </form>
</div>
{% endblock %}
